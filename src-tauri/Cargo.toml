[package]
name = "spore-tunnel-gui"
version = "1.0.0"
description = "Expose local TCP services through Bore and Spore tunnel servers, natively"
authors = ["Rastrian"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
dirs = "6"
# OS-native keyring backends for every CI/dev target. Without features the
# keyring v3 default backend is the in-memory MOCK — secrets would be lost
# on every app restart. Cargo unifies features per target, so each platform
# picks its own backend from this list (Windows / macOS / Linux).
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "linux-native-sync-persistent",
] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["serde", "v4"] }
open = "5"
semver = "1"
# Update checker only: no default features (drops native-tls & friends),
# rustls keeps the binary lean and CI-safe.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
