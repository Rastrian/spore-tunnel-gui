# Spore Tunnel CI/CD
#
# - PRs and pushes to main: test + build, upload installer artifact.
# - Tag push (v*): same build, then PUBLISH a GitHub Release with the NSIS
#   installer + SHA256SUMS.txt (consumed by the in-app update checker).
#
# Releases are tag-driven only. To cut one:
#   git tag vX.Y.Z && git push origin vX.Y.Z

name: Build Spore Tunnel

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend unit tests
        run: npm test -- --run

      # Non-tag builds: builds the app and uploads nothing to releases
      # (releaseId output stays empty). Tag builds: uploads the NSIS
      # installer to a DRAFT release named after the tag.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Spore Tunnel v__VERSION__"
          releaseBody: "Windows installer for Spore Tunnel. The Bore/Spore tunnel protocol is implemented natively - no external binaries needed."
          releaseDraft: true
          prerelease: false

      - name: Generate SHA256SUMS.txt
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          # Guard against stale bundle artifacts restored by the Rust cache:
          # keep only installers matching the current product name.
          Get-ChildItem "$dir/*.exe" |
            Where-Object { $_.Name -notlike "Spore.Tunnel_*" } |
            Remove-Item -Force
          $files = Get-ChildItem "$dir/Spore.Tunnel_*.exe" | Select-Object -ExpandProperty Name
          if (-not $files) { Write-Error "no Spore.Tunnel_* installer found"; exit 1 }
          $lines = foreach ($name in $files) {
            $hash = (Get-FileHash "$dir/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines -join "`n" | Out-File -Encoding ascii "$dir/SHA256SUMS.txt"
          Get-Content "$dir/SHA256SUMS.txt"

      - name: Attach checksums and publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload "$tag" "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt" --clobber
          gh release edit "$tag" --draft=false
          gh release view "$tag"

      - name: Upload installer artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
